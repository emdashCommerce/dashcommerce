name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 6's CLI forks a Node process; the runner's default Node is 20
      # but Astro requires >=22.12.0. Set Node before Bun so `node` in PATH
      # points at 22 when `astro check` / `astro build` fork.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      # Version constant drift check
      - name: Check DASHCOMMERCE_VERSION constant
        run: bun test packages/core/test/version-constant.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
  
  compatibility-matrix:
    name: EmDash Compatibility (${{ matrix.emdash-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emdash-version:
          - "0.37.0"  # Oldest supported (keep 0.37 installs unbricked)
          - "1.1.0"   # Current EmDash 1.x line
          - "1.2.0"   # 1.2 hashed-dist patch (version-exact)
          # Add new versions as they're tested and verified
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with specific EmDash version
        run: |
          bun install --frozen-lockfile
          bun add -d emdash@${{ matrix.emdash-version }} @emdash-cms/admin@${{ matrix.emdash-version }}
          bun add -d --cwd packages/core emdash@${{ matrix.emdash-version }} @emdash-cms/admin@${{ matrix.emdash-version }}
          bun add --cwd packages/starter emdash@${{ matrix.emdash-version }} @emdash-cms/cloudflare@${{ matrix.emdash-version }}

      - name: Typecheck core + create
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/create typecheck

      - name: Build core + create
        run: |
          bun run --cwd packages/core build
          bun run --cwd packages/create build

      - name: Test
        run: bun run test

      # Starter tracks EmDash 1.x (migrations.json + emdash/internal/*).
      # Skip it on the 0.37 matrix job so we still validate the published
      # plugin against the oldest supported host without requiring the
      # demo site to dual-boot 0.37 and 1.x schemas.
      - name: Typecheck + build starter
        if: matrix.emdash-version != '0.37.0'
        run: |
          bun run --cwd packages/starter typecheck
          bun run --cwd packages/starter build
