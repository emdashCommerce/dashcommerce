name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 6's CLI forks a Node process; the runner's default Node is 20
      # but Astro requires >=22.12.0. Set Node before Bun so `node` in PATH
      # points at 22 when `astro check` / `astro build` fork.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
        continue-on-error: true
  
  compatibility-matrix:
    name: EmDash Compatibility (${{ matrix.emdash-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emdash-version:
          - "0.37.0"  # Current minimum supported version
          # Add new versions as they're tested and verified
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with specific EmDash version
        run: |
          bun install --frozen-lockfile
          bun add -d emdash@${{ matrix.emdash-version }} @emdash-cms/admin@${{ matrix.emdash-version }}
          bun add --cwd packages/starter emdash@${{ matrix.emdash-version }} @emdash-cms/cloudflare@${{ matrix.emdash-version }}

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
